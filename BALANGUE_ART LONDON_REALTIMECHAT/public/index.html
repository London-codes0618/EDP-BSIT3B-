<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zero</title><link rel="icon" href="/logo.png">
<style>
:root{--bg:#fff;--bg2:#f0f2f5;--tx:#050505;--mut:#65676b;--line:#e4e6eb;--in:#e9ebef;--logo:#a9bccf;--ig:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);--me:linear-gradient(135deg,#0099ff,#a033ff 60%,#ff5280)}
.dark{--bg:#18191a;--bg2:#242526;--tx:#e4e6eb;--mut:#b0b3b8;--line:#3a3b3c;--in:#3a3b3c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx)}
#login{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--logo)}
.lc{width:min(340px,90vw);background:var(--bg);color:var(--tx);border-radius:28px;padding:30px 26px;text-align:center;box-shadow:0 20px 60px #0003}
.lc img{width:112px;border-radius:26px;display:block;margin:0 auto 14px}
.lc h1{margin:0;font-size:30px;letter-spacing:-.5px}.lc p{color:var(--mut);margin:4px 0 18px}
input{width:100%;padding:12px 16px;border-radius:24px;border:0;background:var(--bg2);color:var(--tx);font-size:15px;outline:0}
button{border:0;cursor:pointer;color:#fff;font-weight:700;background:var(--me);padding:12px 20px;border-radius:24px;font-size:15px}
#app{height:100%;display:grid;grid-template-columns:360px 1fr}
#side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.top img{width:38px;height:38px;border-radius:10px}.top h2{margin:0;font-size:26px;flex:1;letter-spacing:-.5px}
.ic{width:36px;height:36px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;cursor:pointer;font-size:16px}
#stories{display:flex;gap:14px;overflow-x:auto;padding:10px 16px 14px;min-height:92px}
.st{text-align:center;font-size:12px;color:var(--mut);flex:none;width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{padding:2.5px;border-radius:50%;background:var(--ig);display:inline-block}.ring .av{border:2.5px solid var(--bg)}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;flex:none}
#rooms{overflow-y:auto;padding:0 8px}
.room{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;cursor:pointer}
.room:hover{background:var(--bg2)}.room.on{background:var(--bg2)}
.room .av{background:var(--bg2);font-size:24px;width:54px;height:54px}.room.on .av{background:var(--bg)}
.room b{display:block;font-size:15px}.room small{color:var(--mut)}
.badge{margin-left:auto;background:#0866ff;color:#fff;font-size:12px;border-radius:12px;padding:2px 8px;font-weight:700}
main{position:relative;display:flex;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);box-shadow:0 1px 6px #0000000d}
header .av{width:42px;height:42px;font-size:20px;background:var(--bg2)}header b{display:block}header small{color:#31a24c}
#chips{display:none!important}
#msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:3px}
.m{display:flex;align-items:flex-end;gap:8px;max-width:72%;margin-top:9px;animation:in .22s ease}.m.me{align-self:flex-end;flex-direction:row-reverse}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.97)}}
.m .av{width:30px;height:30px;font-size:12px}
.bub{padding:9px 14px;border-radius:20px;background:var(--in);position:relative;word-wrap:anywhere}
.me .bub{background:var(--me);background-attachment:fixed;color:#fff}
.nm{font-size:11px;color:var(--mut);margin:0 0 2px 4px}
.rx{display:flex;gap:4px;position:absolute;bottom:-12px;right:8px}.me .rx{left:8px;right:auto}
.rx:empty{display:none}.m:has(.chip){margin-bottom:10px}
.chip{font-size:12px;padding:1px 6px;border-radius:12px;background:var(--bg);border:1px solid var(--line);cursor:pointer;color:var(--tx)}
.pick{position:absolute;top:-34px;left:0;display:none;background:var(--bg);box-shadow:0 2px 14px #0003;border-radius:22px;padding:4px 8px;gap:6px;z-index:2}
.me .pick{left:auto;right:0}.bub:hover .pick{display:flex}.pick span{cursor:pointer;font-size:19px;transition:transform .12s}.pick span:hover{transform:scale(1.4)}
.sys{align-self:center;font-size:12px;color:var(--mut);margin-top:10px}
#typing{height:30px;padding:0 18px}
.dots{display:none;background:var(--in);border-radius:16px;padding:8px 12px;gap:4px;width:fit-content}.dots.on{display:flex}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-4px);opacity:.5}}
form{display:flex;gap:10px;padding:12px 16px;align-items:center}
form button{width:42px;height:42px;padding:0;border-radius:50%;font-size:17px}
@media(max-width:760px){#app{grid-template-columns:1fr}#side{display:none}#chips{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line)}
#chips span{flex:none;padding:6px 14px;border-radius:16px;background:var(--bg2);font-size:14px}#chips .on{background:#0866ff;color:#fff}}
.dark img{filter:invert(1)}
#login{background:var(--bg2)}.lc img{width:140px;border-radius:0;margin-bottom:18px}.top img{width:auto;height:46px;border-radius:0}
.room .av,header .av{background:var(--me);color:#fff;font-size:20px}.room.on .av{background:var(--me)}
#emo{flex:none;font-size:22px;width:42px;height:42px;background:var(--bg2)}
#pop{display:none;position:absolute;left:14px;bottom:70px;width:304px;background:var(--bg);border-radius:16px;box-shadow:0 4px 24px #0004;padding:10px;z-index:5;grid-template-columns:repeat(7,1fr);gap:2px}
#pop.on{display:grid;animation:in .15s ease}#pop span{font-size:25px;text-align:center;padding:4px;border-radius:8px;cursor:pointer}#pop span:hover{background:var(--bg2)}
</style></head><body>
<div id="login"><div class="lc"><img src="/logo.png" alt="Zero"><h1>Zero</h1><p>Chat in realtime. Start from zero.</p>
<input id="nm" placeholder="Choose a username" maxlength="16" autofocus><br><br><button id="go" style="width:100%">Start chatting</button></div></div>
<div id="app"><div id="side"><div class="top"><img src="/logo.png" alt=""><h2>Chats</h2><div class="ic" id="mode" title="Dark mode">🌙</div></div>
<div id="stories"></div><div id="rooms"></div></div>
<main><header><div class="av" id="hav"></div><div><b id="title"></b><small id="act"></small></div></header><div id="chips"></div>
<div id="msgs"></div><div id="typing"><div class="dots" id="dots"><i></i><i></i><i></i></div><small id="tn" style="color:var(--mut)"></small></div>
<div id="pop"></div><form id="f"><div class="ic" id="emo" title="Emoji">😊</div><input id="tx" placeholder="Aa" autocomplete="off"><button>➤</button></form></main></div>
<script>
const $=(s)=>document.querySelector(s),EM=["👍","❤️","😂","🔥"],ICON={balangue:"B"};
let name,color=Math.floor(Math.random()*360),room="balangue",id,es,counts={},tmr,lastT=0,rooms=[];
const av=(n,c)=>{const d=document.createElement("div");d.className="av";d.textContent=n[0].toUpperCase();d.style.background=`hsl(${c} 65% 50%)`;return d};
$("#go").onclick=()=>{name=$("#nm").value.trim()||"Guest";$("#login").remove();connect()};
$("#nm").onkeydown=(e)=>e.key==="Enter"&&$("#go").click();
$("#mode").onclick=()=>{document.body.classList.toggle("dark");$("#mode").textContent=document.body.classList.contains("dark")?"☀️":"🌙"};
function connect(){
  if(es)es.close();$("#msgs").innerHTML="";$("#title").textContent="Balangue";$("#hav").textContent=ICON[room];
  es=new EventSource(`/events?name=${encodeURIComponent(name)}&room=${room}&color=${color}`);
  es.addEventListener("welcome",(e)=>{const d=JSON.parse(e.data);id=d.id;rooms=d.rooms;d.history.forEach(addMsg);drawRooms()});
  es.addEventListener("message",(e)=>{addMsg(JSON.parse(e.data));typing("")});
  es.addEventListener("system",(e)=>{const d=JSON.parse(e.data);add(Object.assign(document.createElement("div"),{className:"sys",textContent:d.text}));
    $("#act").textContent="Active now · "+d.roster.length;$("#stories").innerHTML="";
    d.roster.forEach((u)=>{const s=document.createElement("div");s.className="st";const r=document.createElement("div");r.className="ring";r.append(av(u.name,u.color));s.append(r,document.createElement("br"),u.name===name?"You":u.name);$("#stories").append(s)})});
  es.addEventListener("counts",(e)=>{counts=JSON.parse(e.data);drawRooms()});
  es.addEventListener("typing",(e)=>{typing(JSON.parse(e.data).name+" is typing");clearTimeout(tmr);tmr=setTimeout(()=>typing(""),1800)});
  es.addEventListener("reaction",(e)=>{const d=JSON.parse(e.data),el=$("#m"+d.id);if(el)drawRx(el.querySelector(".rx"),d)});
}
function typing(t){$("#dots").classList.toggle("on",!!t);$("#tn").textContent=t}
function drawRooms(){const b=$("#rooms"),c=$("#chips");b.innerHTML=c.innerHTML="";rooms.forEach((r)=>{
  const d=document.createElement("div");d.className="room"+(r===room?" on":"");
  d.innerHTML=`<div class="av">${ICON[r]}</div><div><b>Balangue</b><small>${counts[r]||0} active now</small></div>`+(counts[r]?`<span class="badge">${counts[r]}</span>`:"");
  d.onclick=()=>{if(r!==room){room=r;connect()}};b.append(d);
  const ch=Object.assign(document.createElement("span"),{textContent:ICON[r]+" "+r,className:r===room?"on":"",onclick:d.onclick});c.append(ch)})}
function add(el){const b=$("#msgs");b.append(el);b.scrollTop=b.scrollHeight}
function drawRx(box,m){box.innerHTML="";Object.entries(m.reactions).forEach(([e,l])=>{const c=document.createElement("span");c.className="chip";c.textContent=e+(l.length>1?" "+l.length:"");c.title=l.join(", ");c.onclick=()=>react(m.id,e);box.append(c)})}
function react(msgId,emoji){fetch("/react",{method:"POST",body:JSON.stringify({id,msgId,emoji})})}
function addMsg(m){
  const me=m.name===name,w=document.createElement("div");w.id="m"+m.id;w.className="m"+(me?" me":"");
  const col=document.createElement("div"),b=document.createElement("div");b.className="bub";b.title=m.time;
  if(!me){col.append(Object.assign(document.createElement("div"),{className:"nm",textContent:m.name}))}
  const t=document.createElement("span");t.textContent=m.text;                      // textContent blocks XSS
  const rx=document.createElement("div");rx.className="rx";
  const p=document.createElement("div");p.className="pick";EM.forEach((e)=>{const s=document.createElement("span");s.textContent=e;s.onclick=()=>react(m.id,e);p.append(s)});
  b.append(p,t,rx);col.append(b);w.append(...(me?[col]:[av(m.name,m.color),col]));drawRx(rx,m);add(w)}
$("#f").onsubmit=(e)=>{e.preventDefault();const v=$("#tx").value;if(v.trim())fetch("/send",{method:"POST",body:JSON.stringify({id,text:v})});$("#tx").value=""};
const ALL="😀😂😍🥰😎🤩😘😜🤗🤔😅😭😢😡🥳😴🤯😇🙃😋🙏👍👎👏🙌💪👋✌️🤝❤️🧡💛💚💙💜🖤💔🔥✨🎉💯⚡🌙⭐🎮📚🎵🍕🍔☕🐶🐱🌈".match(/\p{Extended_Pictographic}\uFE0F?/gu);
ALL.forEach((e)=>{const s=document.createElement("span");s.textContent=e;s.onclick=()=>{const t=$("#tx");t.value+=e;t.focus()};$("#pop").append(s)});
$("#emo").onclick=(e)=>{e.stopPropagation();$("#pop").classList.toggle("on")};
document.addEventListener("click",(e)=>{if(!e.target.closest("#pop"))$("#pop").classList.remove("on")});
$("#tx").oninput=()=>{if(Date.now()-lastT>1000){lastT=Date.now();fetch("/typing",{method:"POST",body:JSON.stringify({id})})}};
</script></body></html>
